<svg width="680" viewBox="0 0 680 800" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Orchard fleet log pipeline — extension to conversation</title>
<desc>Flow from the Chrome extension's log emitters through the scrubbed ring, the cloud shipper, AWS ingestion and CloudWatch, the exporter Lambda, the GitHub mailbox repo, down to a Claude Code conversation that pulls and analyzes; a parallel panel-download lane carries payload-bearing traces and chats through the Downloads folder. Standalone copy of the widget shown in the 2026-07-31 session (measured event-to-git latency: 69 s).</desc>
<style>
  /* Self-contained restyle of the chat-widget classes (the host normally supplies these). */
  text { font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  .t  { font-size: 14px; fill: #1c1917; }
  .ts { font-size: 12px; fill: #57534e; }
  .th { font-size: 14px; font-weight: 500; fill: #1c1917; }
  .zone { fill: none; stroke: #a8a29e; }
  .box  { fill: #f5f5f4; stroke: #a8a29e; }
  .arr  { stroke: #78716c; fill: none; stroke-width: 1.5; }
  .c-blue rect { fill: #dbeafe; stroke: #3b82f6; }
  .c-blue .th, .c-blue .t { fill: #1e3a8a; }
  .c-blue .ts { fill: #1d4ed8; }
  .c-teal rect { fill: #ccfbf1; stroke: #14b8a6; }
  .c-teal .th, .c-teal .t { fill: #134e4a; }
  .c-teal .ts { fill: #0f766e; }
  #arrowhead { stroke: #78716c; }
  @media (prefers-color-scheme: dark) {
    .t, .th { fill: #e7e5e4; }
    .ts { fill: #a8a29e; }
    .zone { stroke: #57534e; }
    .box { fill: #292524; stroke: #57534e; }
    .arr { stroke: #a8a29e; }
    .c-blue rect { fill: #1e3a5f; stroke: #60a5fa; }
    .c-blue .th, .c-blue .t { fill: #bfdbfe; }
    .c-blue .ts { fill: #93c5fd; }
    .c-teal rect { fill: #134e4a; stroke: #2dd4bf; }
    .c-teal .th, .c-teal .t { fill: #99f6e4; }
    .c-teal .ts { fill: #5eead4; }
    #arrowhead { stroke: #a8a29e; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path id="arrowhead" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<!-- Zone 1: extension -->
<rect class="zone" x="40" y="30" width="600" height="192" rx="16" stroke-width="0.5" stroke-dasharray="6 4"/>
<text class="th" x="60" y="56">Chrome extension — this machine</text>
<g class="c-blue">
  <rect x="60" y="76" width="190" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="155" y="97" text-anchor="middle">Log emitters</text>
  <text class="ts" x="155" y="114" text-anchor="middle">_orchLog · console taps</text>
</g>
<g class="c-blue">
  <rect x="270" y="76" width="170" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="355" y="97" text-anchor="middle">Scrubbed ring</text>
  <text class="ts" x="355" y="114" text-anchor="middle">PII out at write</text>
</g>
<g class="c-blue">
  <rect x="60" y="148" width="190" height="54" rx="8" stroke-width="0.5"/>
  <text class="th" x="155" y="169" text-anchor="middle">Cloud shipper</text>
  <text class="ts" x="155" y="187" text-anchor="middle">level gate → outbox</text>
</g>
<g>
  <rect class="box" x="465" y="148" width="150" height="54" rx="8" stroke-width="0.5"/>
  <text class="th" x="540" y="169" text-anchor="middle">Panel download</text>
  <text class="ts" x="540" y="187" text-anchor="middle">gl · gc · gch</text>
</g>
<line x1="250" y1="102" x2="264" y2="102" class="arr" marker-end="url(#arrow)"/>
<path d="M310 128 L310 138 L155 138 L155 143" class="arr" marker-end="url(#arrow)"/>
<path d="M400 128 L400 138 L540 138 L540 143" class="arr" marker-end="url(#arrow)"/>

<!-- Zone 1 -> Zone 2 -->
<line x1="155" y1="206" x2="155" y2="253" class="arr" marker-end="url(#arrow)"/>
<!-- Panel lane down -->
<line x1="540" y1="206" x2="540" y2="295" class="arr" marker-end="url(#arrow)"/>

<!-- Zone 2: AWS -->
<rect class="zone" x="40" y="258" width="400" height="182" rx="16" stroke-width="0.5" stroke-dasharray="6 4"/>
<text class="th" x="60" y="284">AWS — OrchardP0Dev (us-east-1)</text>
<g class="c-blue">
  <rect x="60" y="300" width="180" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="150" y="321" text-anchor="middle">API /v1/logs/batch</text>
  <text class="ts" x="150" y="338" text-anchor="middle">JWT · validate · stamp</text>
</g>
<g class="c-blue">
  <rect x="260" y="300" width="160" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="321" text-anchor="middle">CloudWatch</text>
  <text class="ts" x="340" y="338" text-anchor="middle">/orchard/dev/client</text>
</g>
<g class="c-blue">
  <rect x="150" y="368" width="200" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="250" y="389" text-anchor="middle">Exporter Lambda</text>
  <text class="ts" x="250" y="406" text-anchor="middle">1-min tick · gl grammar</text>
</g>
<line x1="240" y1="326" x2="254" y2="326" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="352" x2="340" y2="363" class="arr" marker-end="url(#arrow)"/>

<!-- Downloads (panel lane) -->
<g>
  <rect class="box" x="465" y="300" width="150" height="110" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text class="th" x="540" y="328" text-anchor="middle">Downloads</text>
  <text class="ts" x="540" y="350" text-anchor="middle">orchard-logs-*.txt</text>
  <text class="ts" x="540" y="368" text-anchor="middle">orchard-chats-*.txt</text>
</g>

<!-- Zone 2 -> Zone 3 -->
<line x1="250" y1="420" x2="250" y2="471" class="arr" marker-end="url(#arrow)"/>
<!-- Panel lane long drop -->
<line x1="540" y1="410" x2="540" y2="643" class="arr" marker-end="url(#arrow)"/>

<!-- Zone 3: GitHub mailbox -->
<rect class="zone" x="40" y="476" width="400" height="130" rx="16" stroke-width="0.5" stroke-dasharray="6 4"/>
<text class="th" x="60" y="502">GitHub — orchard-logs (private)</text>
<text class="ts" x="60" y="520">one commit per tick · measured event→git: 69 s</text>
<g class="c-blue">
  <rect x="60" y="534" width="360" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="240" y="555" text-anchor="middle">Hour files</text>
  <text class="ts" x="240" y="572" text-anchor="middle">logs/date/user/install/HH.txt</text>
</g>

<!-- Zone 3 -> Zone 4 -->
<line x1="250" y1="606" x2="250" y2="643" class="arr" marker-end="url(#arrow)"/>

<!-- Zone 4: the conversation -->
<rect class="zone" x="40" y="648" width="600" height="114" rx="16" stroke-width="0.5" stroke-dasharray="6 4"/>
<text class="th" x="60" y="674">Claude Code conversation — any machine</text>
<g class="c-teal">
  <rect x="60" y="690" width="160" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="140" y="711" text-anchor="middle">git pull</text>
  <text class="ts" x="140" y="728" text-anchor="middle">apps/orchard-logs</text>
</g>
<g class="c-teal">
  <rect x="240" y="690" width="200" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="711" text-anchor="middle">Read + analyze</text>
  <text class="ts" x="340" y="728" text-anchor="middle">grep '▸' → decisions</text>
</g>
<g class="c-teal">
  <rect x="460" y="690" width="160" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="540" y="711" text-anchor="middle">findings.md</text>
  <text class="ts" x="540" y="728" text-anchor="middle">the run journal</text>
</g>
<line x1="220" y1="716" x2="234" y2="716" class="arr" marker-end="url(#arrow)"/>
<line x1="440" y1="716" x2="454" y2="716" class="arr" marker-end="url(#arrow)"/>

<!-- Legend -->
<g class="c-blue"><rect x="60" y="772" width="12" height="12" rx="3"/></g>
<text class="ts" x="80" y="782">shipping pipeline (automatic)</text>
<g class="c-teal"><rect x="280" y="772" width="12" height="12" rx="3"/></g>
<text class="ts" x="300" y="782">reading side (on demand)</text>
</svg>
