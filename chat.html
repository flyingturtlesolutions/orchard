<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orchard</title>
  <link rel="stylesheet" href="assets/chat.css" />
</head>
<body class="chat-page">

  <!-- ── App header ─────────────────────────────────────────────────────── -->
  <header class="app-header">
    <button class="icon-btn" id="btn-history" title="Conversation history">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="app-brand">
      <span class="app-brand-mark">◈</span>
      <span class="app-brand-name">Orchard</span>
    </div>
    <div class="app-header-actions">
      <!-- DB-2 (v2.74.975) — Dev-bridge reload. Hidden unless dev mode is on
           (devBridge drives the .hidden toggle); the amber dot lights when the
           bridge changed repo files since this load. Click → chrome.runtime.reload()
           picks the edits up. This is DESIGN_dev_bridge §5's "Apply & Reload",
           surfaced as a header affordance. Strippable with the bridge module. -->
      <button class="icon-btn dev-reload-btn hidden" id="btn-dev-reload" title="Reload extension (dev)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        <span class="dev-reload-dot" aria-hidden="true"></span>
      </button>
      <!-- v2.74.981 — Ground launcher. Swaps the side panel to sidepanel.html
           and routes the shell into ground-view (read-only Ground browse).
           Mirrors popup.js's "Ground" entry; lives between the dev-reload and
           Studio buttons per the header affordance order. -->
      <button class="icon-btn" id="btn-open-ground" title="Open Ground (side panel)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </button>
      <!-- v2.27.0 — Studio launcher. Opens the Studio tab (authoring surface).
           Lab button removed in message 3 of the Studio relocation: sidepanel
           is now chat-only, there's no Lab mode to switch to. -->
      <button class="icon-btn" id="btn-open-studio" title="Open Studio (authoring tab)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3h7v7"/>
          <path d="M10 14L21 3"/>
          <path d="M21 14v7H3V3h7"/>
        </svg>
      </button>
      <!-- v2.71.4 — Hide panel button. Closes the side panel without
           cancelling running invocations. User reopens via the toolbar
           icon. Toolbar badge indicates running tasks. -->
      <button class="icon-btn" id="btn-hide-panel" title="Hide panel (running tasks continue)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── v2.71.7 — Running-invocations transport bar ──────────────────────
       Sticky below the header. Renders rows for each running invocation
       with a stop button. Hidden when nothing is running. Visible regardless
       of which conversation is loaded — shows global running state.
  -->
  <div class="running-bar hidden" id="running-bar"></div>

  <!-- ── App body (v2.74.1030): the conversation drawer is now an INLINE left-push panel, not a fixed
       slide-over with a dark backdrop. It opens beneath the header inside this flex row and the chat column
       shrinks to make room — so the chat + input stay visible and usable while the drawer is open. -->
  <div class="app-body" id="app-body">

  <!-- ── Conversation drawer (left; pushes the chat column) ─────────────── -->
  <aside class="history-sidebar" id="history-sidebar">
    <div class="history-sidebar-inner">
    <div class="history-header">
      <span class="history-title">Conversations</span>
      <button class="icon-btn" id="btn-delete-all-conversations" title="Delete all conversations">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6M14 11v6"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-close-history" title="Close">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <button class="history-new-btn" id="btn-new-conversation">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      <span>New app</span>
    </button>
    <!-- v2.74.1029 — New dev conversation: a dedicated Claude Code thread. The click requests the
         nativeMessaging permission (replacing `dev: on`) and opens a kind:'dev' conversation where typed
         messages route to Claude Code with no `dev:` prefix. Strippable with the dev-bridge module. -->
    <button class="history-new-btn history-new-dev-btn" id="btn-new-dev-conversation" title="Chat with Claude Code on this repo">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"/>
        <polyline points="8 6 2 12 8 18"/>
      </svg>
      <span>New dev</span>
    </button>
    <div class="history-list" id="history-list">
      <div class="history-empty">No conversations yet.</div>
    </div>
    </div><!-- /.history-sidebar-inner -->
  </aside>

  <!-- ── Chat column: conversation + input (shrinks when the drawer opens) ─ -->
  <div class="chat-main" id="chat-main">
  <!-- ── Main conversation area ─────────────────────────────────────────── -->
  <main class="conversation" id="conversation">
    <!-- DBR-6 (v2.74.1039) — dev-conversation branch-status header. Panel-only (injection-boundary rule:
         nothing here touches the page). Hidden for agent conversations; shown + populated by chat.js
         (_renderDevStatusHeader) only while a dev conversation is active. -->
    <div class="dev-status-header hidden" id="dev-status-header" hidden></div>

    <!-- Empty state — shown when no messages yet -->
    <div class="empty-state" id="empty-state">
      <div class="empty-state-content">
        <h1 class="empty-state-greeting" id="empty-state-greeting">How can I help you today?</h1>
        <p class="empty-state-subtitle" id="empty-state-subtitle">
          Loading available capabilities…
        </p>
        <div class="suggestion-cards" id="suggestion-cards"></div>
      </div>
    </div>

    <!-- Message list — populated as conversation progresses -->
    <div class="messages hidden" id="messages"></div>
  </main>

  <!-- v2.72.52 (Stage 3) — Walk-mode <section> removed. Chat no longer
       overlays a walk panel; chat is only chat. v2.74.22 — The
       fragment-walk sidepanel mode that this comment used to point at
       is gone too (AI-walked path eliminated); fragment authoring lives
       in the sidepanel fragment-author mode. -->

  <!-- ── Input area ─────────────────────────────────────────────────────── -->
  <div class="input-area">
    <div class="input-container">
      <!-- Slash command picker — shown when input starts with / -->
      <div class="slash-picker hidden" id="slash-picker">
        <div class="slash-picker-header">
          <span class="slash-picker-hint">
            <kbd>↑↓</kbd> navigate · <kbd>↵</kbd> select · <kbd>esc</kbd> dismiss
          </span>
        </div>
        <div class="slash-picker-list" id="slash-picker-list"></div>
      </div>

      <span class="input-status" id="input-status"></span>
      <div class="input-row">
        <textarea
          id="chat-input"
          class="chat-input"
          rows="1"
          placeholder="Message Orchard…  (type / for capabilities)"></textarea>
        <button class="send-btn" id="btn-chat-send" disabled title="Send message">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
      <div class="input-meta">
        <span class="input-hint">Enter to send · Shift+Enter for newline · / for capabilities</span>
        <button class="link-btn" id="btn-toggle-drawer" title="Show capability buttons">
          Browse capabilities
        </button>
      </div>
    </div>
  </div>
  </div><!-- /.chat-main -->
  </div><!-- /.app-body -->

  <!-- ── Capability picker drawer ───────────────────────────────────────── -->
  <div class="capability-drawer hidden" id="capability-drawer">
    <div class="drawer-header">
      <span class="drawer-title">Available capabilities</span>
      <button class="icon-btn" id="btn-close-drawer" title="Close">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="drawer-content" id="capability-list"></div>
  </div>

  <!-- Toast notifications -->
  <div class="toast hidden" id="toast"></div>

  <script type="module" src="chat.js"></script>
</body>
</html>
